<style>
/* Layout: a working desk. Header with project + mode; a phase rail that reads like a production line; panels below. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --sunk:#eceee7; --ink:#17211c; --muted:#5b6961; --line:#d8ddd4;
  --accent:#1d6a49; --accent-ink:#ffffff; --amber:#b9740f; --ok:#2b8553; --warn:#b98207; --bad:#bf3b28; --info:#2f6690;
  --ok-bg:#e3f1e8; --warn-bg:#f8efd9; --bad-bg:#f8e3df; --info-bg:#e1ecf5;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Instrument Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --sunk:#1c2621; --ink:#e5ebe7; --muted:#9aa89f; --line:#2b3731;
  --accent:#47b07e; --accent-ink:#06130d; --amber:#e0a246; --ok:#4fbf80; --warn:#e2b23e; --bad:#ec6b55; --info:#6aa8d8;
  --ok-bg:#16301f; --warn-bg:#33290f; --bad-bg:#3a1b16; --info-bg:#132a3c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunk:#1c2621; --ink:#e5ebe7; --muted:#9aa89f; --line:#2b3731;
  --accent:#47b07e; --accent-ink:#06130d; --amber:#e0a246; --ok:#4fbf80; --warn:#e2b23e; --bad:#ec6b55; --info:#6aa8d8;
  --ok-bg:#16301f; --warn-bg:#33290f; --bad-bg:#3a1b16; --info-bg:#132a3c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-stretch:88%;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800} h2{font-size:19px;font-weight:750} h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.wrap{max-width:1240px;margin:0 auto}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark i{display:block;width:16px;height:4px;background:var(--accent-ink);border-radius:2px;box-shadow:0 6px 0 var(--accent-ink),0 -6px 0 var(--accent-ink)}
.brand b{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:17px;letter-spacing:.01em}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.proj{max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:14px 0 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mut{background:var(--sunk);color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-stretch:80%;font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.amber i{background:var(--amber)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:600}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.copy{border:0;background:none;color:var(--muted);padding:0 4px;font-size:12px}
/* phase line */
.line{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding:4px 2px 10px}
.stage{flex:1 0 118px;display:flex;flex-direction:column;gap:6px}
.stack{flex:1.4 0 160px;display:flex;flex-direction:column;gap:6px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;min-height:72px}
.node:hover{border-color:var(--muted)}
.node.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.node .nm{font-family:var(--display);font-stretch:85%;font-weight:750;font-size:14px;line-height:1.1}
.node .pc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stack .node{min-height:0;padding:7px 10px}
.arrow{align-self:center;color:var(--line);font-size:18px;flex:none}
.stagehead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* tasks */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.st{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.st.feito{background:var(--ok);border-color:var(--ok);color:#fff}
.st.andamento{border-color:var(--info);color:var(--info)}
.st.bloqueado{border-color:var(--bad);color:var(--bad)}
.st.na{border-style:dashed;color:var(--muted)}
.task .t{font-weight:600}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
.late{color:var(--bad);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* hero (visual do projeto) */
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:26px;display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.hero h1{font-size:36px;font-stretch:78%;color:var(--bg)}
.hero .tag{color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hero p{color:color-mix(in srgb,var(--bg) 80%,transparent);max-width:62ch;margin:8px 0 0}
.hero .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.hero .nums div{border-top:2px solid var(--amber);padding-top:8px}
.hero .nums b{display:block;font-family:var(--display);font-stretch:78%;font-size:30px;font-weight:800;color:var(--bg);font-variant-numeric:tabular-nums}
.hero .nums span{font-size:12px;color:color-mix(in srgb,var(--bg) 70%,transparent)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
/* gantt */
.gantt{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:6px 10px;align-items:center;font-size:12px}
.gtrack{position:relative;height:18px;background:var(--sunk);border-radius:5px}
.gbar{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--accent);min-width:4px}
.gbar.c2{background:var(--amber)}
.gtoday{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.gx-wrap{overflow-x:auto}
.gx{display:grid;grid-template-columns:minmax(150px,240px) minmax(420px,1fr);gap:6px 12px;align-items:center;font-size:12.5px}
.gx-axis{position:relative;height:18px;border-bottom:1px solid var(--line)}
.gx-axis span{position:absolute;top:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-left:3px;border-left:1px solid var(--line);white-space:nowrap}
.gx-sec{grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.gx-lbl{min-width:0}.gx-lbl .b{font-weight:700}
.gx-track{position:relative;height:20px;background:var(--sunk);border-radius:5px}
.gx-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--accent);min-width:5px}
.gx-bar.c-prep{background:var(--muted)}.gx-bar.c-exec{background:var(--amber)}.gx-bar.c-fim{background:var(--accent)}
.gx-marco{position:absolute;top:4px;width:11px;height:11px;margin-left:-6px;transform:rotate(45deg);border:2px solid var(--accent);background:var(--surface)}
.gx-marco.ok{background:var(--accent)}
.tr-sec td{background:var(--sunk)}
@media (max-width:640px){.gx{grid-template-columns:118px minmax(300px,1fr);font-size:11.5px}}
/* photos */
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img,.thumbs video{width:76px;height:76px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--sunk)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal img,.gal video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;box-shadow:var(--shadow)}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-weight:600;font-size:13px}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;width:100%}
.form textarea{min-height:84px;resize:vertical}
.form .ck{display:flex;gap:8px;align-items:center;font-weight:500}
.form .ck input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.note{background:var(--info-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px;border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
/* campo (mobile first) */
.campo{max-width:620px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:block;width:100%;text-align:left}
.card+.card{margin-top:8px}
.acc{display:grid;gap:8px}
.accitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.yn{display:inline-flex;gap:4px}
.yn button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.people{display:grid;gap:6px}
.people .pr{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0}
@media (prefers-reduced-motion:no-preference){.node,.btn,.chip{transition:border-color .15s,background .15s}}
</style>

<div class="top"><div class="wrap">

</div></div>
<main class="wrap" id="app"></main>

    get: async function(){ var r = await sb.from("docs").select("path,data").eq("path", p).maybeSingle(); if (r.error) throw erro(r.error); return {exists:!!r.data, id:p.split("/").pop(), data:function(){ return r.data ? r.data.data : undefined; }}; },
    set: async function(data){ var r = await sb.from("docs").upsert({path:p, col:colDe(p), data:data}); if (r.error) throw erro(r.error); },
    update: async function(data){ var c = await sb.from("docs").select("data").eq("path", p).maybeSingle(); if (c.error || !c.data) throw {code:"invalid_argument", message:"documento não existe"};
      var r = await sb.from("docs").update({data:mergeFundo(c.data.data, data)}).eq("path", p); if (r.error) throw erro(r.error); },
    delete: async function(){ var r = await sb.from("docs").delete().eq("path", p); if (r.error) throw erro(r.error); } }; }
  function collection(col){ var self = {
    get: async function(){ var r = await sb.from("docs").select("path,data").eq("col", col).limit(5000); if (r.error) throw erro(r.error); return snapDocs(r.data || []); },
    doc: function(id){ return doc(col + "/" + id); },
    onSnapshot: function(next, err){ var vivo = true, t = null;
      function puxa(){ self.get().then(function(s){ if (vivo) next(s); }, function(e){ if (vivo && err) err(e); }); }
      var ch = sb.channel("c" + uid()).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"col=eq." + col}, function(){ clearTimeout(t); t = setTimeout(puxa, 300); }).subscribe();
      var iv = setInterval(puxa, 90000); puxa();
      return function(){ vivo = false; clearInterval(iv); clearTimeout(t); try { sb.removeChannel(ch); } catch(e){} }; } };
    return self; }
  return {doc:doc, collection:collection};
}
/* artefato do coordenador: lê e grava no MESMO banco da página web pelo conector "NTICS Execução" (MCP) */
var CONECTOR = "NTICS Execução";
function payloadDe(r){ var p = r && (r.payload !== undefined ? r.payload : r.structuredContent);
  if (typeof p === "string") { try { p = JSON.parse(p); } catch(e){} }
  if (p && !Array.isArray(p) && Array.isArray(p.itens)) p = p.itens;
  if (p == null && r && r.content) { try { p = JSON.parse(r.content.filter(function(c){ return c.type === "text"; }).map(function(c){ return c.text; }).join("")); } catch(e){} }
  return p; }
function dbConector(mcp){
  function snap(lista){ var docs = (lista || []).map(function(x){ var d = x.dados !== undefined ? x.dados : (function(){ var o = Object.assign({}, x); delete o.id; delete o.atualizadoEm; return o; })();
    return {id:x.id, data:function(){ return d; }}; }); return {docs:docs, size:docs.length, empty:!docs.length}; }
  async function chama(tool, input){ var r = await mcp.callTool(CONECTOR, tool, input, {cache:false}); return payloadDe(r); }
  async function escreveu(){ try { await mcp.invalidate(CONECTOR, "listar_colecao"); } catch(e){} }
  function doc(p){ return {
    get: async function(){ var r = await chama("ler_documento", {caminho:p}); return {exists:!!(r && r.existe), id:p.split("/").pop(), data:function(){ return r && r.dados; }}; },
    set: async function(data){ await chama("salvar_documento", {caminho:p, dados:data}); await escreveu(); },
    update: async function(data){ await chama("atualizar_documento", {caminho:p, dados:data}); await escreveu(); },
    delete: async function(){ await chama("apagar_documento", {caminho:p}); await escreveu(); } }; }
  function collection(col){ var self = {
    get: async function(){ return snap(await chama("listar_colecao", {colecao:col})); },
    doc: function(id){ return doc(col + "/" + id); },
    onSnapshot: function(next, err){ return mcp.watchTool(CONECTOR, "listar_colecao", {colecao:col}, function(ev){
      if (ev.type === "data") next(snap(payloadDe(ev.result))); else if (err) err(ev.error); }, {refetchInterval:30000}); } };
    return self; }
  return {doc:doc, collection:collection};
}
function modosPermitidos(){ if (!WEB || !S.perfil) return ["escritorio","campo","patrocinador"];
  return {escritorio:["escritorio","campo","patrocinador"], produtor:["campo"], fotografo:["campo"], patrocinador:["patrocinador"]}[S.perfil.papel] || []; }
function assinarProjetos(){
  var primeiro = true;
  S.db.collection("projetos").onSnapshot(function(snap){
    var novo = {}; snap.docs.forEach(function(d){ novo[d.id] = Object.assign({}, d.data()); }); S.projetos = novo;
    if (primeiro) { primeiro = false; S.ready = true; var ids = Object.keys(novo);
      if (S.modo !== "escritorio" || ids.length === 1) { var last = lsGet("mx-proj"); if (last && novo[last]) { abrirProjeto(last); return; } if (ids.length === 1) { abrirProjeto(ids[0]); return; } } }
    render();
  }, function(){ S.ready = true; toast("Não foi possível ler os projetos."); render(); });
}
async function initWeb(){
  if (!window.supabase) { S.ready = true; S.erroWeb = "Não foi possível carregar a conexão com o banco. Verifique a internet e recarregue."; render(); return; }
  WEBSB = window.supabase.createClient(CONFIG.url, CONFIG.anon);
  WEBSB.auth.onAuthStateChange(function(ev){ if (ev === "PASSWORD_RECOVERY") { S.recuperar = true; render(); } });
  var ses = (await WEBSB.auth.getSession()).data.session;
  if (!ses) { S.ready = true; S.precisaLogin = true; render(); return; }
  await entrouWeb(ses);
}
async function entrouWeb(ses){
  var r = await WEBSB.from("perfis").select("*").eq("user_id", ses.user.id).maybeSingle();
  if (!r.data) { S.ready = true; S.semPerfil = ses.user.email; render(); return; }
  S.perfil = r.data; S.precisaLogin = false; S.db = dbSupabase(WEBSB);
  var ms = modosPermitidos(); if (ms.indexOf(S.modo) < 0) S.modo = ms[0];
  assinarProjetos(); render();
}

      msg.className = "small"; msg.textContent = r.error ? "Não foi possível enviar agora. Peça a nova senha ao escritório." : "Se o e-mail estiver cadastrado, chega um link para criar uma nova senha."; }}, "Esqueci minha senha"),

  app.appendChild(h("div", {class:"campo", style:"margin-top:8vh"}, h("div", {class:"panel"}, h("h1", {text:"Criar nova senha"}),
    h("form", {class:"form", onsubmit:async function(e){ e.preventDefault(); var r = await WEBSB.auth.updateUser({password:s1.value});
      if (r.error) { msg.textContent = "Não foi possível trocar a senha: " + r.error.message; return; } S.recuperar = false; toast("Senha trocada."); var ses = (await WEBSB.auth.getSession()).data.session; if (ses) await entrouWeb(ses); else render(); }},
      h("label", {for:"ns1"}, "Nova senha (mínimo 8 caracteres)", s1), msg, h("div", {class:"row"}, h("span", {class:"sp"}), h("button", {type:"submit", class:"btn pri"}, "Salvar senha"))))));

var PAPEIS = [["escritorio","Equipe do escritório"],["produtor","Produtor de campo"],["fotografo","Fotógrafo"],["patrocinador","Patrocinador"]];
async function chamarAcessos(corpo){ var ses = (await WEBSB.auth.getSession()).data.session;
  var r = await fetch(CONFIG.url + "/functions/v1/acessos", {method:"POST", headers:{Authorization:"Bearer " + ses.access_token, apikey:CONFIG.anon, "Content-Type":"application/json"}, body:JSON.stringify(corpo)});
  var j = await r.json().catch(function(){ return {}; }); if (!r.ok) throw new Error(j.erro || "Falha ao falar com o servidor."); return j; }
function renderAcessos(app){
  app.appendChild(h("div", {class:"row", style:"margin:18px 0 12px"}, h("button", {class:"back", onclick:function(){ S.telaHome = null; render(); }}, "‹ Visão geral"), h("span", {class:"sp"}),
    h("button", {class:"btn pri", onclick:function(){ editarAcesso(null); }}, "Novo acesso")));
  app.appendChild(h("h1", {text:"Acessos"})); app.appendChild(h("p", {class:"muted", text:"Quem entra na máquina e o que vê. Produtor e fotógrafo veem só o diário de campo dos projetos marcados; o patrocinador vê só o painel dele."}));
  var pan = h("div", {class:"panel"}, h("div", {class:"muted small", text:"Carregando…"})); app.appendChild(pan);
  chamarAcessos({acao:"listar"}).then(function(j){ S.acessos = j.perfis || []; pan.textContent = "";
    if (!S.acessos.length) { pan.appendChild(h("div", {class:"muted small", text:"Nenhum acesso."})); return; }
    var tb = h("table", null, h("thead", null, h("tr", null, ["Nome","E-mail","Papel","Projetos",""].map(function(x){ return h("th", {text:x}); }))), h("tbody"));
    S.acessos.forEach(function(p){ tb.lastChild.appendChild(h("tr", null, h("td", {text:p.nome||""}), h("td", {class:"mono small", text:p.email||""}), h("td", {text:(PAPEIS.find(function(x){ return x[0] === p.papel; })||[0,p.papel])[1]}),
      h("td", {class:"small", text: p.papel === "escritorio" ? "Todos" : (p.projetos||[]).map(function(id){ return S.projetos[id] ? S.projetos[id].numero : id; }).join(", ")}),
      h("td", null, h("button", {class:"btn ghost", onclick:function(){ editarAcesso(p); }}, "Editar")))); });
    pan.appendChild(h("div", {class:"tbl"}, tb)); }, function(e){ pan.textContent = e.message; });

function editarAcesso(p){
  var campos = [{k:"nome", t:"Nome", req:true}, {k:"email", t:"E-mail", tipo:"email", req:true}, {k:"papel", t:"Papel", tipo:"select", opts:PAPEIS, def:"produtor"},
    {k:"senha", t: p ? "Nova senha (deixe em branco para manter)" : "Senha inicial (mínimo 8 caracteres)", tipo:"text"}, {tipo:"sep", t:"Projetos que esta pessoa acessa"}];
  Object.keys(S.projetos).forEach(function(id){ campos.push({k:"pj_" + id, t:(S.projetos[id].numero || "") + " · " + S.projetos[id].nome, tipo:"check"}); });
  var val = Object.assign({}, p || {}); (p && p.projetos || []).forEach(function(id){ val["pj_" + id] = true; }); val.senha = "";

}

document.getElementById("selProj").addEventListener("change", function(e){ abrirProjeto(e.target.value || null); });
["mEsc","mCampo","mPat"].forEach(function(b){ document.getElementById(b).addEventListener("click", function(e){ S.modo = e.currentTarget.dataset.modo; S.campo = {tela:"lista"}; S.telaHome = null; lsSet("mx-modo", S.modo); render(); }); });

/* ---------- inicialização ---------- */
(function(){ var hs = String(location.hash || "").replace("#",""); if (hs === "campo" || hs === "patrocinador" || hs === "escritorio") S.modo = hs; else S.modo = lsGet("mx-modo") || "escritorio";
  var t = lsGet("mx-tab"); if (t && TABS.some(function(x){ return x[0] === t; })) S.tab = t; })();
render();
if (WEB) initWeb(); else (async function(){
  var c = window.claude;
  var db = c && c.use ? await c.use("db") : null;
  try { S.user = c && c.use ? await c.use("user") : null; } catch(e){}
  try { S.assets = c && c.use ? await c.use("assets") : null; } catch(e){}
  // preferência: o banco único pelo conector; sem conector, o banco próprio do artefato (só consulta)
  var mcp = null; try { mcp = c && c.use ? await c.use("mcp") : null; } catch(e){}
  if (mcp) { try { var t = await mcp.callTool(CONECTOR, "listar_projetos", null, {cache:false}); if (Array.isArray(payloadDe(t))) { S.db = dbConector(mcp); S.viaConector = true; } }
    catch(e){ S.erroConector = (e && e.code) || "erro"; } }
