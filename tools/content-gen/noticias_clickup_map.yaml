# Consumido por: rotina agendada de sabado (tools/content-gen) e pela skill carrossel-noticias.
# Cada entrada liga a segunda-feira de inicio da semana (semana_inicio) as tasks do ClickUp
# onde o documento das 9 noticias e publicado.
#
# Como a rotina usa este arquivo:
#   1. Calcula SEMANA = segunda-feira da semana que vai comecar (fuso BRT).
#   2. Procura a entrada com semana_inicio == SEMANA.
#   3. Publica o documento em carrossel_task_id e artigo_task_id.
