# (carrossel com entrega no sabado 2026-09-05). semana_inicio de cada semana N e calculado
# como 2026-08-31 + (N - 24) * 7 dias, cadencia de 1 semana por numero de semana.
#
# A serie "Noticias ESG" no ClickUp vai ate a Semana 24 (ultima edicao agendada no momento
# da reconstrucao). Para semanas futuras (S25+), criar as tasks no ClickUp e acrescentar as
# entradas correspondentes aqui.
#
# Observacao: onde carrossel_task_id esta null, a task "Carrossel Noticias SNN — Noticias ESG"
