name: PMO Diario

on:
  schedule:
    # 11h UTC = 8h BRT (UTC-3). Em horario de verao BR (nov-mar), roda as 9h BRT.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_business_day_check:
        description: 'Forcar execucao mesmo em feriado?'
        required: false
        default: 'false'
        type: boolean

jobs:
  pmo-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Write Google credentials from secrets
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        run: |
          mkdir -p tools/gws
          printf '%s' "$GMAIL_TOKEN_JSON" > tools/gws/token.json
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > tools/gws/credentials.json

      - name: Run PMO Daily
        env:
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.skip_business_day_check }}" = "true" ]; then
            EXTRA="--skip-business-day-check"
          fi
          python -X utf8 tools/reports/run_pmo_daily.py --mode send $EXTRA

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmo-diario-${{ github.run_number }}
          path: output/relatorios/pmo-diario/
          retention-days: 30
